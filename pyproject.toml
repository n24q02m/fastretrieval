[project]
name = "fastretrieval"
version = "1.13.0"
description = "Fast multi-model retrieval runtime: ONNX and GGUF embeddings, reranking, and a declarative model contract"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "n24q02m" }]
keywords = ["vector", "embedding", "reranking", "qwen3", "onnx", "onnxruntime"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # numpy 2.5 dropped cp311 wheels and 2.4.x never shipped cp315 ones, so the
    # floor of each line is the first release with wheels for that interpreter.
    "numpy>=2.4.6,<2.5; python_version < '3.15'",
    "numpy>=2.5.2; python_version >= '3.15'",
    # onnxruntime publishes no cp315 wheel and no sdist (through 1.32.0), so on 3.15
    # it is not resolvable at all. The ONNX backend then raises a clear ImportError
    # at model load (fastretrieval/common/onnx_model.py) instead of the whole install
    # failing; lift the marker in the change that adopts the first cp315 wheel.
    "onnxruntime>1.20.0; python_version < '3.15'",
    "tqdm>=4.70.1",
    "requests>=2.34.2",
    # Floor reflects the minimal stable Tokenizer/AddedToken/Encoding/encode_batch
    # API surface this package actually uses (stable since ~0.13), not "latest".
    # Keep it low so fastretrieval stays co-installable with transformers and other
    # tokenizers consumers (e.g. transformers 5.10.x caps tokenizers<=0.23.0). See #691.
    "tokenizers>=0.23.3,<1.0",
    "huggingface-hub>=1.33.0,<2.0",
    "loguru>=0.7.3",
]

[project.optional-dependencies]
gguf = ["llama-cpp-python>=0.3.36"]
image = ["pillow>=13.0.0,<14.0"]
# fastretrieval.server: the shared /embed + /rerank HTTP surface. The model
# runtime itself is a base dependency, so only the ASGI stack is optional.
server = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.3,<3",
]
all = ["fastretrieval[gguf,image,server]"]

[project.scripts]
fastretrieval-server = "fastretrieval.server.__main__:main"

[project.urls]
Homepage = "https://github.com/n24q02m/fastretrieval"
Repository = "https://github.com/n24q02m/fastretrieval"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "syrupy>=6.1.1",
    "ruff>=0.17.3",
    "ty>=0.0.99,<0.0.100", # 0.0.96 reports 5 new missing-union-attribute errors (Optional narrowing); fix then lift
    # fastapi.testclient.TestClient drives the server tests over ASGI.
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastretrieval"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
uv build
"""
major_on_zero = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"

[tool.ty]

[tool.ty.rules]
# llama_cpp is an optional dependency (not in default venv)
unresolved-import = "warn"
# onnxruntime has incomplete type stubs (SparseTensor union issues)
possibly-missing-attribute = "warn"
invalid-argument-type = "warn"
unresolved-attribute = "warn"
not-subscriptable = "warn"
invalid-assignment = "warn"
# multiprocessing context has dynamic Process attr
call-non-callable = "warn"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # redundant with ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests requiring real ONNX model download (~1.2 GB)",
]
