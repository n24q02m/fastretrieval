# =============================================================================
# CI Template: Public Python MCP Server (fastretrieval)
# Source: https://github.com/n24q02m/.github/templates/ci/public-python.yml
#
# Runner strategy: ubuntu-latest for every job (private repos render the self-hosted
# ARM64 lane, public repos render ubuntu-latest), harden-runner everywhere.
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Every event gets its own group keyed by EVENT + PR/issue/ref, so a newer
  # run only ever cancels an older run of the SAME pr/ref/event. Two past
  # defects encoded here:
  # 1. event_name in the key: issues events have no
  #    pull_request.number and run on the default ref, so without it their
  #    group collapsed to the push-to-main group and a stray event cancelled
  #    an in-flight main build.
  # 2. NO shared "bot-serial" group: all bot PRs (Renovate, Jules, ...)
  #    used to share one group with cancel-in-progress, so any bot activity
  #    (e.g. Renovate rebasing after a merge to main) cancelled every other
  #    bot PR's in-flight CI — bot PRs chronically showed CANCELLED checks and
  #    could never be merged on a green gate. The single self-hosted runner
  #    already serializes job EXECUTION; per-PR groups just let runs queue.
  group: >-
    ${{ format('ci-{0}-{1}-{2}', github.workflow, github.event_name, github.event.pull_request.number || github.event.issue.number || github.ref) }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # README registry metadata: the package carries this repo's README to PyPI,
  # so a manifest naming a file that is not there publishes an empty project
  # page. Keep the local check in CI as well as pre-commit and CD.
  # ============================================================================
  readme-sync:
    name: Verify README registry metadata
    # Not on schedule (folded in for CodeQL's weekly scan), issues, or
    # pull_request_target -- none of those existed in this file's original
    # trigger set for this check.
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.action != 'edited')
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  # ============================================================================
  # Lint & Test (Python)
  # ============================================================================
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python }})
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.action != 'edited')
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check --exit-zero-on-warning

      - name: Run tests with coverage
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            uv run pytest -m "not integration" --tb=short --cov=fastretrieval --cov-report=xml
          else
            echo "No tests found, skipping..."
          fi

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # SAST is NOT a job here. Private repos scan with Semgrep via
  # templates/visibility/private/.github/workflows/semgrep.yml; public repos scan with
  # CodeQL. Putting a semgrep job in this file would ship Semgrep to public repos too,
  # which is the rule inverted -- see test_public_repos_do_not_get_semgrep.

  # ============================================================================
  # Dependency Review
  # ============================================================================
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
        # Advisory, not a gate: the action fails the step on any pre-existing
        # moderate advisory in a dependency the PR merely touches, which blocks
        # unrelated work on a finding the PR did not introduce. The PR comment is
        # the deliverable here.
        continue-on-error: true

  # ============================================================================
  # Email Notification
  # ============================================================================
  email-notify:
    name: Email Notification
    if: >-
      (github.event_name == 'issues'
       || (github.event_name == 'pull_request_target' && github.event.action == 'opened'))
      && github.actor != 'n24q02m'
      && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Send email notification
        uses: dawidd6/action-send-mail@03a02a49409134de07636216fb379a026c52991e # v21
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >-
            [${{ github.event.repository.name }}]
            ${{ github.event_name == 'issues' && 'Issue' || 'PR' }}
            #${{ github.event.issue.number || github.event.pull_request.number }}:
            ${{ github.event.issue.title || github.event.pull_request.title }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Notify <${{ secrets.SMTP_USERNAME }}>
          body: |
            ${{ github.event_name == 'issues' && 'New issue' || 'New pull request' }} in ${{ github.repository }}

            Title: ${{ github.event.issue.title || github.event.pull_request.title }}
            Author: ${{ github.actor }}
            URL: ${{ github.event.issue.html_url || github.event.pull_request.html_url }}
            Action: ${{ github.event.action }}

            ---
            ${{ github.event.issue.body || github.event.pull_request.body || 'No description provided.' }}

  # ============================================================================
  # Bot PR Governance (merged from bot-governance.yml; runs on PR opened only)
  # ============================================================================
  governance:
    name: Bot PR Rate Limit & Duplicate Check
    # Internal PRs only. This repo is public, so `pull_request` gives a fork a
    # read-only GITHUB_TOKEN that the `permissions:` block above cannot raise --
    # `gh pr close` would then fail under `set -e` and abort the job. Closing an
    # outside contributor's PR because someone else spent the rate limit is the
    # wrong outcome anyway; the bots this governs push their branches to this
    # repo, so fork PRs are never in scope. Comparing full_name rather than
    # head.repo.fork keeps this correct if this repository is ever itself a
    # fork, where head.repo.fork would be true for internal branches too.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'opened'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Detect and govern bot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # Detect if this is a bot-created PR by branch name pattern.
          # Two signals:
          #   1. Explicit bot-tool prefixes (Bolt, Palette, Jules, fix/web-scraper)
          #   2. Any branch ending with a long numeric task/trace ID (-[0-9]{14,})
          IS_BOT_PR=false
          if echo "$BRANCH" | grep -qE \
              '^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])'; then
            IS_BOT_PR=true
          elif echo "$BRANCH" | grep -qE -- \
              '-[0-9]{14,}$'; then
            IS_BOT_PR=true
          fi

          if [ "$IS_BOT_PR" = "false" ]; then
            echo "Not a bot PR ($BRANCH), skipping governance checks."
            exit 0
          fi

          echo "Bot PR detected on branch: $BRANCH"
          gh pr edit "$PR_NUMBER" --add-label "bot-generated" --repo "$REPO" || true

          # --- Rate limit: max 5 bot PRs/actor/day ---
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
                  date -u -v-24H +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh pr list --repo "$REPO" --state open \
                   --json createdAt,headRefName,author \
                   --jq "[.[] |
                          select(.author.login == \"$ACTOR\") |
                          select(.createdAt > \"$SINCE\") |
                          select(.headRefName | test(
                            \"^(bolt[-/]|palette-ux-|fix/web-scraper-|jules[-/])\" +
                            \"|-[0-9]{14,}$\"
                          ))] | length" 2>/dev/null || echo 0)

          echo "Bot PRs by $ACTOR in last 24h: $COUNT"

          if [ "${COUNT:-0}" -gt 5 ]; then
            gh pr close "$PR_NUMBER" --repo "$REPO" \
              --comment "**Bot rate limit exceeded**: $COUNT PRs created in the last 24 hours (limit: 5/day). This PR has been automatically closed to reduce PR backlog and CI resource waste. Please consolidate related fixes."
            echo "PR #$PR_NUMBER closed: rate limit exceeded ($COUNT/5 today)"
            exit 0
          fi

          # --- Duplicate detection by title keyword ---
          KEYWORD=$(echo "$PR_TITLE" | sed 's/[^a-zA-Z0-9 _-]//g' | \
                    tr '[:upper:]' '[:lower:]' | cut -c1-50 | xargs)
          if [ -z "$KEYWORD" ]; then
            echo "No keyword extracted, skipping duplicate check."
            exit 0
          fi

          DUPES=$(gh pr list --repo "$REPO" --state open --search "$KEYWORD" \
                   --json number \
                   --jq "[.[] | select(.number != $PR_NUMBER)] | length" \
                   2>/dev/null || echo 0)

          echo "Similar open PRs for '$KEYWORD': $DUPES"
          if [ "${DUPES:-0}" -ge 1 ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" \
              --add-label "possible-duplicate" || true
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "**Possible duplicate**: found ${DUPES} open PR(s) with similar title ('${KEYWORD}'). Check before merging: \`gh pr list --search '${KEYWORD}' --state open\`"
          fi

  # ============================================================================
  # CodeQL (merged from codeql.yml; weekly schedule folded into on: above)
  # ============================================================================
  analyze:
    name: Analyze (CodeQL)
    if: >-
      github.event_name == 'push'
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.action != 'edited')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        # Omit languages so CodeQL uses its supported repository autodetection.
      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

  # ============================================================================
  # Integration paths gate: integration.yml used a native `paths:` filter on
  # pull_request/push. Workflow-level paths cannot be scoped per job, so this
  # gate reproduces the same file set via git diff and the integration job
  # needs-gates on it. The pattern list is the original trigger's, verbatim.
  # ============================================================================
  integration-paths:
    name: Integration paths gate
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request' && github.event.action != 'edited')
    runs-on: ubuntu-latest
    outputs:
      hit: ${{ steps.gate.outputs.hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE" || true
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || echo "DIFF_FAILED")
          if [ "$CHANGED" = "DIFF_FAILED" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"  # fail open: run the suite
            exit 0
          fi
          if echo "$CHANGED" | grep -qE '^(fastretrieval/|tests/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # Integration (merged from integration.yml; paths filter via gate job)
  # ============================================================================
  integration:
    name: Integration (real models, Python 3.13)
    needs: [integration-paths]
    if: >-
      needs.integration-paths.outputs.hit == 'true'
      && (github.event_name == 'push'
          || (github.event_name == 'pull_request' && github.event.action != 'edited'))
    runs-on: ubuntu-latest
    # Provisional, sized for a cold cache. Run 31232142381 was killed at 30 minutes
    # having produced no readable progress, so there is no measurement yet to tighten
    # this against; the download and test steps below are split precisely so the next
    # run yields one. Public repositories get unlimited GitHub-hosted minutes, so a
    # generous ceiling costs nothing and a too-tight one costs the whole signal.
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Setup Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Restore and save are separate steps on purpose. The combined `actions/cache`
      # step writes the cache from a post-job step, and post-job steps are SKIPPED
      # when a job is cancelled. Run 31232142381 hit the job timeout on a cold cache,
      # so `Post Cache model weights` never ran, nothing was stored, and the next run
      # would have started cold as well -- a cache that can never bootstrap itself.
      # Saving immediately after the download makes the cache independent of how long
      # the tests take, or whether they pass at all.
      #
      # Model weights are immutable, so the key is fixed and the cache is written
      # once. Bump the version suffix when the set of models the suite pulls changes,
      # otherwise the new weights are re-downloaded on every run and never cached.
      - name: Restore model cache
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fastretrieval
          key: fastretrieval-models-v1

      - name: Install dependencies
        run: uv sync --python 3.13 --group dev

      # Downloading in its own step also splits the bill: this step's duration is
      # transfer, the test step's is inference. Run 31232142381 could not tell them
      # apart because both happened inside one opaque 30-minute block.
      #
      # The five model names are the ONNX models `tests/test_integration*.py` and
      # `tests/test_integration_q4f16.py` construct. The GGUF pair is absent because
      # `llama-cpp-python` is not installed here (see the note on the test step), so
      # those tests skip and their weights are never touched.
      #
      # Xenova/ms-marco-MiniLM-L-6-v2 is deliberately NOT here even though
      # tests/test_custom_reranker_registry.py fetches it: it is not a built-in model,
      # so pre-fetching it would mean duplicating that test's custom registration in
      # this YAML. At 80 MB against the 2.08 GB already cached it is not worth the
      # duplication, and drift in this list degrades rather than breaks -- a model
      # missing here is downloaded by the test that needs it, inside the test budget.
      - name: Download model weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          uv run python - <<'PY'
          import time

          from fastretrieval import TextCrossEncoder, TextEmbedding

          EMBEDDINGS = [
              "n24q02m/Qwen3-Embedding-0.6B-ONNX",
              "n24q02m/Qwen3-Embedding-0.6B-ONNX-Q4F16",
          ]
          RERANKERS = [
              "n24q02m/Qwen3-Reranker-0.6B-ONNX",
              "n24q02m/Qwen3-Reranker-0.6B-ONNX-Q4F16",
              "n24q02m/Qwen3-Reranker-0.6B-ONNX-YesNo",
          ]

          for cls, names in ((TextEmbedding, EMBEDDINGS), (TextCrossEncoder, RERANKERS)):
              for name in names:
                  start = time.monotonic()
                  cls(name)
                  print(f"{name}: {time.monotonic() - start:.1f}s", flush=True)
          PY

      # No `always()` here. The point is to be independent of the TEST step, which
      # this step already is by sitting before it; running on failure as well would
      # store a half-finished download under a fixed key, and a fixed key is never
      # re-fetched -- the suite would restore a broken cache forever.
      - name: Save model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fastretrieval
          key: fastretrieval-models-v1

      # The `gguf` extra is deliberately absent from the dev install: llama-cpp-python
      # 0.3.34 ships an sdist only -- no wheels for any platform -- so installing it
      # here would mean a from-source C++ build on every cold cache. The 13 tests in
      # tests/test_integration_gguf.py therefore skip, which is honest: they are not
      # covered here, and the file's pytest.importorskip reports that.
      #
      # PYTHONUNBUFFERED because pytest's progress output is block-buffered when
      # stdout is a pipe. Run 31232142381 was killed with thirty minutes of progress
      # still sitting in that buffer: the log showed nothing after "69 selected", so
      # the timeout could not be attributed to any test. `-v` names each test as it
      # finishes and `--durations` ranks them, which turns a future timeout into a
      # reading instead of a mystery.
      #
      # The two timeouts are not redundant; they fail in different ways on purpose.
      # Run 31233596338 had unbuffered `-v` output and STILL printed no test result in
      # 59 minutes, while the same suite finishes locally in 233s. Something blocks,
      # and a blocked test can hold the GIL:
      #
      #   faulthandler_timeout dumps every thread's stack from C, so it reports even
      #   when no Python bytecode can run -- but it only reports, it does not unblock.
      #   --timeout aborts the test so the remaining ones still run, which is what
      #   turns one run into a full census of what hangs instead of just the first.
      #
      # 300s per test is ~85x the local per-test average (233s / 69), so it accuses
      # only a genuine block, never a slow runner.
      - name: Run integration tests
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          uv run pytest -m integration --tb=short -v --durations=25
          -o faulthandler_timeout=120 --timeout=300

  # ============================================================================
  # PR Title (merged from pr-title.yml; `edited` folded into on: above)
  # ============================================================================
  pr-title:
    name: Validate PR title (Conventional Commits subset)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Repo rule: only feat: and fix: (feedback_commit_prefix.md). This is
          # narrower than PSR's own default allowed_tags (which also treats
          # perf: as patch-worthy) -- we enforce the project convention here,
          # not just what PSR itself would accept.
          types: |
            fix
            feat
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase character.
