name: convert

on:
  workflow_dispatch:
    inputs:
      model:
        description: HuggingFace model id to convert as a smoke test
        required: false
        default: hf-internal-testing/tiny-random-BertModel
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Convert a tiny model end to end
        env:
          MODEL: ${{ inputs.model || 'hf-internal-testing/tiny-random-BertModel' }}
        run: |
          uv run --with-requirements fastretrieval/convert/requirements.txt \
            python -m fastretrieval.convert onnx "$MODEL" \
            --out ./smoke-out --pooling mean --normalize

      - name: Check the artifacts exist
        run: |
          test -f ./smoke-out/onnx/model_quantized.onnx
          test -f ./smoke-out/onnx/model_q4f16.onnx
          test -f ./smoke-out/fastretrieval-manifest.json
          test -f ./smoke-out/config.json
          test -f ./smoke-out/tokenizer.json
          test -f ./smoke-out/tokenizer_config.json

      - name: Verify parity and load the runtime inputs
        env:
          MODEL: ${{ inputs.model || 'hf-internal-testing/tiny-random-BertModel' }}
        run: |
          uv run --with-requirements fastretrieval/convert/requirements.txt \
            python -m fastretrieval.convert verify ./smoke-out --source "$MODEL"
          uv run --with-requirements fastretrieval/convert/requirements.txt python - <<'PY'
          from pathlib import Path

          import onnxruntime as ort

          from fastretrieval.common.preprocessor_utils import load_tokenizer

          root = Path("smoke-out")
          load_tokenizer(root)
          for artifact in sorted((root / "onnx").glob("*.onnx")):
              session = ort.InferenceSession(
                  str(artifact), providers=["CPUExecutionProvider"]
              )
              assert session.get_inputs(), artifact
              assert session.get_outputs(), artifact
          print("converted ONNX variants load with runtime tokenizer and ORT")
          PY
