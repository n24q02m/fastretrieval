repos:
  # ============================================================================
  # Security: Secret Detection (MUST be first — blocks commit if secrets found)
  # ============================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (detect secrets)
  # ============================================================================
  # Common Checks
  # ============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        exclude_types: [image]
      - id: check-merge-conflict
        name: check for merge conflicts
      - id: check-json
        name: check JSON files
        types: [json]
      - id: check-yaml
        name: check YAML files
        types: [yaml]
      - id: check-toml
        name: check TOML files
        types: [toml]
      - id: end-of-file-fixer
        name: fix end of files
        exclude_types: [image]

  # ============================================================================
  # Registry metadata: the sdist and wheel carry this repo's README to PyPI, so
  # a manifest naming a file that is not there publishes an empty project page.
  # ============================================================================
  - repo: local
    hooks:
      - id: verify-readme-sync
        name: Verify README registry metadata
        entry: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.
        language: system
        pass_filenames: false

  # ============================================================================
  # Python
  # ============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2 # v0.16.1
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix, --target-version=py311]
      - id: ruff-format
        name: ruff format

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: mise exec -- uv run ty check --exit-zero-on-warning
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: mise exec -- uv run pytest -m "not integration" --tb=short -q
        language: system
        types: [python]
        pass_filenames: false

  # ============================================================================
  # Commit Message Enforcement
  # ============================================================================
  - repo: local
    hooks:
      - id: enforce-commit
        name: Enforce feat and fix commit prefixes
        entry: bash scripts/enforce-commit.sh
        language: system
        stages: [commit-msg]

  # ============================================================================
  # Content integrity: block ASCII rewriting of Vietnamese diacritics
  # + Unicode punctuation (em-dash, ellipsis, arrows, smart quotes, emoji).
  # See scripts/preserve-diacritics.py and feedback_vietnamese_diacritics rule.
  # ============================================================================
  - repo: local
    hooks:
      - id: preserve-diacritics
        name: Preserve Vietnamese diacritics + Unicode punctuation
        entry: python scripts/preserve-diacritics.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
